name: CI

on:
  push:
    branches:
    - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
    - name: Checkout gpualn
      uses: actions/checkout@v4

    # `make` builds the CUDA binary, which needs nvcc; runners have no CUDA.
    # `make cpu` builds gpualn-cpu, the CUDA-free build.
    - name: Compile with ${{ matrix.compiler }}
      run:  make cpu CC=${{ matrix.compiler }}

  build-aarch64:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
    - name: Checkout gpualn
      uses: actions/checkout@v4

    - name: Compile with ${{ matrix.compiler }}
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: aarch64
        distro: ubuntu20.04
        githubToken: ${{ github.token }}
        dockerRunArgs: |
          --volume "${PWD}:/gpualn"
        install: |
          apt-get update -q -y
          apt-get install -q -y make ${{ matrix.compiler }} zlib1g-dev
        run: |
          cd /gpualn
          make cpu CC=${{ matrix.compiler }}
